<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <rect width="1600" height="900" fill="#fff"/>
  <defs>
    <marker id="openArrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M1,1 L10,6 L1,11" fill="none" stroke="#222" stroke-width="1.6"/>
    </marker>
  </defs>
  <style>
    .title { font-family: Arial, Helvetica, sans-serif; font-size: 28px; font-weight: 700; fill: #111; }
    .label { font-family: Arial, Helvetica, sans-serif; font-size: 18px; font-weight: 700; fill: #111; }
    .small { font-family: Arial, Helvetica, sans-serif; font-size: 14px; fill: #333; }
    .box { fill: #fff; stroke: #222; stroke-width: 2.2; }
    .soft { fill: #fafafa; stroke: #222; stroke-width: 2.2; }
    .dep { fill: none; stroke: #222; stroke-width: 2; stroke-dasharray: 9 7; stroke-linecap: round; stroke-linejoin: round; }
  </style>

  <text x="800" y="58" text-anchor="middle" class="title">Diagrama UML de Pacotes - Barbearia</text>
<path d="M100 208 L100 310 L380 310 L380 208 L226 208 L226 190 L100 190 Z" class="box"/>
  <text x="240" y="238" text-anchor="middle" class="label">Interface Web / PWA</text>
  <text x="240" y="266" text-anchor="middle" class="small">React</text>
  <text x="240" y="289" text-anchor="middle" class="small">Manifest + Service Worker</text>
<path d="M480 208 L480 310 L760 310 L760 208 L606 208 L606 190 L480 190 Z" class="box"/>
  <text x="620" y="238" text-anchor="middle" class="label">Autenticação</text>
