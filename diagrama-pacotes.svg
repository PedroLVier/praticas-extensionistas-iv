<path d="M675 698 L675 800 L925 800 L925 698 L787 698 L787 680 L675 680 Z" class="box"/>
  <text x="800" y="729" text-anchor="middle" class="label">Persistência</text>
  <text x="800" y="758" text-anchor="middle" class="small">Acesso a dados</text>
  <text x="800" y="781" text-anchor="middle" class="small">PostgreSQL</text>
<path d="M380 250 H480" class="dep" marker-end="url(#openArrow)"/>
  <path d="M760 250 H860" class="dep" marker-end="url(#openArrow)"/>
<path d="M1000 310 V374 H395 V460" class="dep" marker-end="url(#openArrow)"/>
  <path d="M1000 310 V402 H800 V460" class="dep" marker-end="url(#openArrow)"/>
  <path d="M1000 310 V430 H1205 V460" class="dep" marker-end="url(#openArrow)"/>
<path d="M395 572 V620 H640 V720 H675" class="dep" marker-end="url(#openArrow)"/>
  <path d="M800 572 V680" class="dep" marker-end="url(#openArrow)"/>
