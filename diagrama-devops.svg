<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <rect width="1600" height="900" fill="#fff"/>

  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M1,1 L10,6 L1,11 z" fill="#222"/>
    </marker>
    <marker id="openArrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M1,1 L10,6 L1,11" fill="none" stroke="#222" stroke-width="1.6"/>
    </marker>
  </defs>

  <style>
    .title { font-family: Arial, Helvetica, sans-serif; font-size: 28px; font-weight: 700; fill: #111; }
    .label { font-family: Arial, Helvetica, sans-serif; font-size: 18px; font-weight: 700; fill: #111; }
    .body { font-family: Arial, Helvetica, sans-serif; font-size: 16px; fill: #111; }
    .small { font-family: Arial, Helvetica, sans-serif; font-size: 14px; fill: #333; }
    .stereo { font-family: Arial, Helvetica, sans-serif; font-size: 14px; font-weight: 700; fill: #222; }
    .edge { fill: none; stroke: #222; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }
    .dep { fill: none; stroke: #222; stroke-width: 2; stroke-dasharray: 9 7; stroke-linecap: round; stroke-linejoin: round; }
    .box { fill: #fff; stroke: #222; stroke-width: 2.2; }
    .soft { fill: #fafafa; stroke: #222; stroke-width: 2.2; }
    .subtle { fill: #f5f5f5; stroke: #222; stroke-width: 2; }
  </style>
  <text x="800" y="58" text-anchor="middle" class="title">Diagrama de Arquitetura DevOps - Barbearia</text>
  <rect x="55" y="330" width="205" height="150" rx="26" class="soft"/>
  <text x="157" y="370" text-anchor="middle" class="stereo">«actor»</text>
  <text x="157" y="403" text-anchor="middle" class="label">Desenvolvedor</text>
  <text x="157" y="433" text-anchor="middle" class="small">Git local</text>
  <rect x="330" y="330" width="205" height="150" rx="26" class="soft"/>
  <text x="432" y="370" text-anchor="middle" class="stereo">«repository»</text>
  <text x="432" y="403" text-anchor="middle" class="label">GitHub</text>
  <text x="432" y="433" text-anchor="middle" class="small">Código-fonte / PR</text>
  <rect x="610" y="190" width="420" height="430" rx="34" class="soft"/>
  <text x="820" y="230" text-anchor="middle" class="stereo">«CI/CD»</text>
  <text x="820" y="261" text-anchor="middle" class="label">GitHub Actions</text>
  <rect x="665" y="300" width="310" height="58" rx="14" class="box"/>
  <text x="820.0" y="336" text-anchor="middle" class="body">1. Checkout e dependências</text>
  <rect x="665" y="380" width="310" height="58" rx="14" class="box"/>
  <text x="820.0" y="416" text-anchor="middle" class="body">2. Lint e testes</text>
  <rect x="665" y="460" width="310" height="58" rx="14" class="box"/>
  <text x="820.0" y="496" text-anchor="middle" class="body">3. Build frontend e backend</text>
  <rect x="665" y="540" width="310" height="58" rx="14" class="box"/>
  <text x="820.0" y="576" text-anchor="middle" class="body">4. Deploy para Render</text>
  <rect x="640" y="670" width="360" height="92" rx="20" class="subtle" stroke-dasharray="9 7"/>
  <text x="820" y="706" text-anchor="middle" class="label">GitHub Secrets</text>
  <text x="820" y="736" text-anchor="middle" class="small">URLs, tokens e variáveis de ambiente</text>
  <path d="M820 670 V620" class="dep" marker-end="url(#openArrow)"/>
  <rect x="1105" y="190" width="430" height="430" rx="34" class="soft"/>
  <text x="1320" y="230" text-anchor="middle" class="stereo">«cloud»</text>
  <text x="1320" y="261" text-anchor="middle" class="label">Render - Produção</text>
  <rect x="1160" y="310" width="320" height="70" rx="16" class="box"/>
  <text x="1320" y="339" text-anchor="middle" class="stereo">Static Site</text>
  <text x="1320" y="365" text-anchor="middle" class="body">Frontend PWA - React</text>
  <rect x="1160" y="405" width="320" height="70" rx="16" class="box"/>
  <text x="1320" y="434" text-anchor="middle" class="stereo">Web Service</text>
  <text x="1320" y="460" text-anchor="middle" class="body">Backend / API - Node.js + Express</text>
  <rect x="1160" y="500" width="320" height="70" rx="16" class="box"/>
  <text x="1320" y="529" text-anchor="middle" class="stereo">Database</text>
  <text x="1320" y="555" text-anchor="middle" class="body">PostgreSQL</text>
  <path d="M260 405 H330" class="edge" marker-end="url(#arrow)"/>
  <text x="295" y="389" text-anchor="middle" class="small">push / PR</text>
  <path d="M535 405 H610" class="edge" marker-end="url(#arrow)"/>
  <text x="572" y="389" text-anchor="middle" class="small">trigger</text>
  <path d="M1030 405 H1105" class="edge" marker-end="url(#arrow)"/>
  <text x="1067" y="389" text-anchor="middle" class="small">deploy</text>
  <text x="800" y="835" text-anchor="middle" class="small">Fluxo contínuo: versionamento → validação → build → publicação em produção</text>
</svg>
